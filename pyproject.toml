[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tidy-cli"
version = "1.0.0"
description = "A terminal file organizer"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "click>=8.0.0",
]

[project.scripts]
tidy = "tidy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tidy*"]
